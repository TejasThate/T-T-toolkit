version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nivesh_db
    restart: always
    environment:
      POSTGRES_USER: nivesh_user
      POSTGRES_PASSWORD: nivesh_password
      POSTGRES_DB: nivesh_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
