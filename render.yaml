services:
  - type: web
    name: tandt-backend
    env: python
    region: oregon
    healthCheckPath: /health
    buildCommand: "cd backend && pip install -r requirements.txt && (alembic upgrade head || true)"
    startCommand: "cd backend && gunicorn -k uvicorn.workers.UvicornWorker -w 1 --timeout 120 app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MARKET_PROVIDER
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
