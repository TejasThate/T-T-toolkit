services:
  - type: web
    name: tandt-backend
    env: python
    region: oregon # Defaulting to a common region, user can change if needed
    healthCheckPath: /health
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && gunicorn -k uvicorn.workers.UvicornWorker -w 2 --timeout 60 app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
